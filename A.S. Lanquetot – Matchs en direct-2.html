<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A.S. Lanquetot – Matchs en direct</title>
<style>
:root{--bg:#f6f3f3;--card:#fff;--tx:#1a1414;--mu:#6a5f5f;--ac:#d7141e;--bd:#e5dcdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0b0b;--card:#1a1616;--tx:#f3eded;--mu:#a89c9c;--ac:#ef2b36;--bd:#332b2b}}
:root[data-theme="dark"]{--bg:#0d0b0b;--card:#1a1616;--tx:#f3eded;--mu:#a89c9c;--ac:#ef2b36;--bd:#332b2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px}
.hd{display:flex;align-items:center;gap:14px;background:#111;border-bottom:4px solid #d7141e;border-radius:14px;padding:10px 14px;margin-bottom:12px}.hd img{height:58px;width:auto}
h1{font-size:20px;margin:0;color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:14px 0 8px}
.card>h2:first-child{margin-top:0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding:6px 0;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.hc{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-left:5px solid var(--ac);padding:12px 14px;margin-bottom:10px;border-radius:12px;font-weight:500}
.hc b{font-size:18px}.hc .hs{font-size:22px;font-weight:800}.hc small{color:var(--mu)}
.tab,.nav button{flex:0 0 auto;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tab.on,.nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.comp{text-align:center;color:var(--mu);font-size:14px}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin:8px 0}
.team{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.score{font-size:42px;font-weight:800;letter-spacing:.04em}
.st{text-align:center}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;background:var(--ac);color:#fff;font-size:13px;font-weight:600}
.pill.off{background:var(--mu)}
.ev{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--bd);align-items:center}
.ev:first-child{border-top:0}
.min{min-width:42px;font-weight:700;color:var(--mu)}
.ev .t{flex:1}.ev small{color:var(--mu)}
.card-y,.card-r{display:inline-block;width:12px;height:17px;border-radius:2px;vertical-align:-3px}
.card-y{background:#f5c400}.card-r{background:#d62828}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols ul{margin:0;padding:0;list-style:none}
.cols b{display:block;margin-bottom:6px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:110px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.x{background:none;color:var(--mu);padding:2px 8px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:center}
.row>*{flex:1 1 120px}
.nav{display:flex;gap:6px;margin-bottom:10px}.nav button{flex:1}
.sc{display:flex;gap:6px;justify-content:center;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--bg);color:var(--tx);border:1px solid var(--bd);font-weight:500}
.chips .sT{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips .sR{border-color:var(--ac);color:var(--ac)}
.pl{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}.pl span{flex:1}
#msg{color:var(--mu);font-size:13px;text-align:center;margin:6px 0}
#err{color:#d62828;font-size:13px;text-align:center}
.empty{color:var(--mu);text-align:center;padding:8px}
</style></head>

<div id="msg">Chargement…</div><div id="err"></div>
<div class="tabs" id="tabs"></div>
<div id="home" hidden></div>
<div id="view" hidden>
  <div class="card">
    <div class="comp" id="comp"></div>
    <div class="board"><div class="team" id="hn"></div><div class="score"><span id="sh">0</span> – <span id="sa">0</span></div><div class="team" id="an"></div></div>
    <div class="st"><span class="pill" id="stat"></span></div>
  </div>
  <div class="card"><h2>Fil du match</h2><div id="evs"></div></div>
  <div class="card"><h2>Composition</h2><div class="cols"><div><b>Titulaires</b><ul id="lxi"></ul></div><div><b>Remplaçants</b><ul id="lsub"></ul></div></div></div>
</div>

<div class="card" id="admin" hidden></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const newM=()=>({opp:"",dom:true,comp:"",lieu:"",st:"Avant-match",min:"",sc:0,so:0,xi:[],sub:[],ev:[]});
const ICON={but:"⚽",jaune:'<i class="card-y"></i>',rouge:'<i class="card-r"></i>',chg:"🔁",info:"📝"};
const LABEL={but:"But",jaune:"Carton jaune",rouge:"Carton rouge",chg:"Remplacement",info:"Info"};
let CLUB={name:"A.S. Lanquetot"},CATS=[],cur="",admin=false,tab="match",db=null,armed="";
const cat=()=>CATS.find(c=>c.id===cur);
const err=t=>$("err").textContent=t;
const fp=p=>(p.n?p.n+" ":"")+p.name;
const sortP=a=>[...a].sort((x,y)=>(+x.n||999)-(+y.n||999)||x.name.localeCompare(y.name));
function arm(k){if(armed===k){armed="";return true}armed=k;setTimeout(()=>{if(armed===k){armed="";renderAdmin(true)}},4000);renderAdmin(true);return false}

async function put(c){if(!db)return;try{await db.doc("cat/"+c.id).set(c);err("")}catch(e){err("Enregistrement impossible : "+(e.message||e.code||"erreur"))}}
function saveCat(c){CATS=CATS.map(x=>x.id===c.id?c:x);render();put(c)}
function upd(p){const c=cat();saveCat({...c,m:{...c.m,...p}})}
async function saveClub(p){CLUB={...CLUB,...p};render();if(db){try{await db.doc("club/info").set(CLUB)}catch(e){err("Enregistrement impossible.")}}}

function render(){
  $("club").textContent=CLUB.name;
  $("tabs").innerHTML=`<button class="tab${cat()?"":" on"}" data-c="">⌂ Accueil</button>`+CATS.map(c=>`<button class="tab${c.id===cat()?.id?" on":""}" data-c="${c.id}">${esc(c.name)}</button>`).join("");
  const c=cat();$("view").hidden=!c;$("none").hidden=!!CATS.length;$("home").hidden=!!c||!CATS.length;
  $("home").innerHTML=CATS.map(x=>{const m=x.m,live=["En cours","2e mi-temps"].includes(m.st),sh=m.dom?m.sc:m.so,sa=m.dom?m.so:m.sc;
    return `<button class="hc" data-c="${x.id}"><b>${esc(x.name)}</b>${m.opp?`<span>${m.dom?"contre":"chez"} ${esc(m.opp)}</span><span class="hs">${sh} – ${sa}</span>`:"<small>Pas de match programmé</small>"}<small>${live?"🔴 EN DIRECT"+(m.min?" · "+esc(m.min)+"’":""):esc(m.st)}</small></button>`}).join("");
  if(c){
    const m=c.m,me=(CLUB.name+" "+c.name).trim(),opp=m.opp||"Adversaire";
    const P=Object.fromEntries(c.players.map(p=>[p.id,p]));
    $("comp").textContent=[m.comp,m.lieu].filter(Boolean).join(" · ");
    $("hn").textContent=m.dom?me:opp;$("an").textContent=m.dom?opp:me;
    $("sh").textContent=m.dom?m.sc:m.so;$("sa").textContent=m.dom?m.so:m.sc;
    const live=["En cours","2e mi-temps"].includes(m.st),p=$("stat");
    p.textContent=(live&&m.min?m.min+"’ · ":"")+m.st;p.className="pill"+(live?"":" off");
    const evs=[...m.ev].sort((a,b)=>(b.min||0)-(a.min||0)||b.id-a.id);
    $("evs").innerHTML=evs.length?evs.map(e=>{
      const nm=e.pid&&P[e.pid]?fp(P[e.pid]):"",txt=[nm,e.p].filter(Boolean).join(" · ");
      return `<div class="ev"><span class="min">${e.min!==""&&e.min!=null?esc(e.min)+"’":""}</span><span>${ICON[e.t]||""}</span><span class="t"><b>${esc(LABEL[e.t]||"")}</b> ${esc(txt)}<br><small>${e.t==="info"?"":esc(e.team==="c"?me:opp)}</small></span>${admin?`<button class="x" data-act="del" data-id="${e.id}">✕</button>`:""}</div>`}).join(""):'<div class="empty">Aucun événement pour le moment.</div>';
    const li=ids=>ids.map(i=>P[i]).filter(Boolean).map(p=>`<li>${esc(fp(p))}</li>`).join("")||"<li class='empty'>À venir</li>";
    $("lxi").innerHTML=li(m.xi);$("lsub").innerHTML=li(m.sub);
  }
  if(admin)renderAdmin();
}

function renderAdmin(force){
  const a=$("admin"),f=document.activeElement;
  if(!force&&f&&f.closest&&f.closest("#admin")&&/INPUT|TEXTAREA/.test(f.tagName))return;
  const c=cat();if(!c)tab="club";let h=`<h2>Espace dirigeant</h2><div class="nav">${[["match","Match"],["squad","Effectif"],["club","Club"]].filter(x=>c||x[0]==="club").map(([k,l])=>`<button class="${tab===k?"on":""}" data-tab="${k}">${l}</button>`).join("")}</div>`;
  if(tab==="club"){
    h+=`<div class="row"><input id="k_name" value="${esc(CLUB.name)}" placeholder="Nom du club"></div><h2>Catégories</h2>`;
    h+=CATS.map(x=>`<div class="pl"><input data-ren="${x.id}" value="${esc(x.name)}"><button class="${armed==="c"+x.id?"":"sec"}" data-act="delcat" data-id="${x.id}">${armed==="c"+x.id?"Confirmer ?":"Supprimer"}</button></div>`).join("");
    h+=`<div class="row" style="margin-top:8px"><input id="k_new" placeholder="Nouvelle catégorie (U13, Seniors…)"><button data-act="addcat" style="flex:0 0 auto">Ajouter</button></div>`;
  }else if(!c){h+=`<div class="empty">Créez d’abord une catégorie dans l’onglet Club.</div>`}
  else if(tab==="squad"){
    h+=`<h2>Ajouter des joueurs à ${esc(c.name)}</h2><textarea id="b_txt" placeholder="Un joueur par ligne, avec le numéro si besoin&#10;10 Dupont&#10;7 Martin&#10;Bernard"></textarea><button data-act="addp" style="width:100%;margin-top:8px">Ajouter à l’effectif</button><h2>Effectif (${c.players.length})</h2>`;
    h+=sortP(c.players).map(p=>`<div class="pl"><span>${esc(fp(p))}</span><button class="x" data-act="delp" data-id="${p.id}">✕</button></div>`).join("")||'<div class="empty">Aucun joueur.</div>';
  }else{
    const m=c.m,sel=sortP(c.players.filter(p=>m.xi.includes(p.id)||m.sub.includes(p.id)));
    const opts=(sel.length?sel:sortP(c.players)).map(p=>`<option value="${p.id}">${esc(fp(p))}</option>`).join("");
    h+=`<div class="row"><input id="m_opp" value="${esc(m.opp)}" placeholder="Adversaire"><select id="m_dom"><option value="1"${m.dom?" selected":""}>À domicile</option><option value="0"${m.dom?"":" selected"}>À l’extérieur</option></select></div>
    <div class="row"><input id="m_comp" value="${esc(m.comp)}" placeholder="Compétition / journée"><input id="m_lieu" value="${esc(m.lieu)}" placeholder="Lieu"></div>
    <div class="row"><select id="m_st">${["Avant-match","En cours","Mi-temps","2e mi-temps","Terminé"].map(s=>`<option${s===m.st?" selected":""}>${s}</option>`).join("")}</select><input id="m_min" value="${esc(m.min)}" placeholder="Minute (ex. 63)"></div>
    <div class="sc"><button class="sec" data-act="sc" data-k="sc" data-d="-1">−</button><span>Nous</span><button data-act="sc" data-k="sc" data-d="1">+1</button><span style="width:14px"></span><button class="sec" data-act="sc" data-k="so" data-d="-1">−</button><span>Adv.</span><button data-act="sc" data-k="so" data-d="1">+1</button></div>
    <h2>Composition du jour (touchez pour changer)</h2><div class="chips">${sortP(c.players).map(p=>{const s=m.xi.includes(p.id)?"T":m.sub.includes(p.id)?"R":"";return `<button class="s${s}" data-act="lu" data-id="${p.id}">${esc(fp(p))}${s?" · "+(s==="T"?"T":"R"):""}</button>`}).join("")||'<div class="empty">Ajoutez d’abord les joueurs dans l’onglet Effectif.</div>'}</div>
    <h2>Ajouter un événement</h2>
    <div class="row"><select id="e_t">${Object.keys(LABEL).map(k=>`<option value="${k}">${LABEL[k]}</option>`).join("")}</select><select id="e_team"><option value="c">Notre équipe</option><option value="o">Adversaire</option></select></div>
    <div class="row"><select id="e_pid"><option value="">— joueur —</option>${opts}</select><input id="e_min" type="number" placeholder="Minute"></div>
    <div class="row"><input id="e_p" placeholder="Précision (ex. remplacé par Martin)"></div>
    <button data-act="addev" style="width:100%">Ajouter</button>
    <button class="${armed==="nm"?"":"sec"}" data-act="newm" style="width:100%;margin-top:14px">${armed==="nm"?"Confirmer : vider le match":"Nouveau match (vide le match en cours)"}</button>`;
  }
  a.innerHTML=h;
}

function wire(){
  const a=$("admin");a.hidden=false;
  a.addEventListener("change",e=>{
    const id=e.target.id,v=e.target.value,c=cat();
    if(id==="k_name")return saveClub({name:v.trim()||"Mon club"});
    if(e.target.dataset.ren)return saveCat({...CATS.find(x=>x.id===e.target.dataset.ren),name:v.trim()||"Catégorie"});
    if(!c)return;
    const mp={m_opp:["opp",v],m_comp:["comp",v],m_lieu:["lieu",v],m_st:["st",v],m_min:["min",v],m_dom:["dom",v==="1"]}[id];
    if(mp)upd({[mp[0]]:mp[1]});
  });
  document.addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.tab){tab=b.dataset.tab;return renderAdmin(true)}
    const act=b.dataset.act,id=b.dataset.id,c=cat();
    if(act==="addcat"){const n=$("k_new").value.trim();if(!n)return;const x={id:uid(),name:n,order:Date.now(),players:[],m:newM()};CATS=[...CATS,x];cur=x.id;put(x);render();renderAdmin(true)}
    else if(act==="delcat"){if(!arm("c"+id))return;CATS=CATS.filter(x=>x.id!==id);if(db)db.doc("cat/"+id).delete().catch(()=>err("Suppression impossible."));render();renderAdmin(true)}
    else if(!c)return;
    else if(act==="addp"){
      const add=$("b_txt").value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\d{1,2})?[\s.\-–]*(.+)$/);return{id:uid(),n:m[1]||"",name:m[2].trim()}});
      if(add.length){saveCat({...c,players:[...c.players,...add]});renderAdmin(true)}
    }
    else if(act==="delp"){saveCat({...c,players:c.players.filter(p=>p.id!==id),m:{...c.m,xi:c.m.xi.filter(i=>i!==id),sub:c.m.sub.filter(i=>i!==id)}});renderAdmin(true)}
    else if(act==="lu"){const T=c.m.xi.includes(id),R=c.m.sub.includes(id);const xi=c.m.xi.filter(i=>i!==id),sub=c.m.sub.filter(i=>i!==id);
      if(!T&&!R)xi.push(id);else if(T)sub.push(id);upd({xi,sub});renderAdmin(true)}
    else if(act==="sc"){upd({[b.dataset.k]:Math.max(0,c.m[b.dataset.k]+ +b.dataset.d)})}
    else if(act==="addev"){
      const t=$("e_t").value,team=$("e_team").value,mn=$("e_min").value;
      const ev=[...c.m.ev,{id:Date.now(),t,team,min:mn===""?"":+mn,pid:team==="c"?$("e_pid").value:"",p:$("e_p").value.trim()}];
      const u={ev};if(t==="but"){if(team==="c")u.sc=c.m.sc+1;else u.so=c.m.so+1}
      upd(u);renderAdmin(true);
    }
    else if(act==="del"){const ev=c.m.ev.find(x=>String(x.id)===id);if(!ev)return;const u={ev:c.m.ev.filter(x=>x!==ev)};
      if(ev.t==="but"){const k=ev.team==="c"?"sc":"so";u[k]=Math.max(0,c.m[k]-1)}upd(u)}
    else if(act==="newm"){if(arm("nm")){upd(newM());renderAdmin(true)}}
  });
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b){cur=b.dataset.c;if(cur)tab="match";location.hash=cur;render();scrollTo(0,0)}});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);cur=CATS.some(c=>c.id===h)?h:"";render()});

(async()=>{
  cur=location.hash.slice(1);
  let user=null;
  try{user=await claude.use("user")}catch(e){}
  try{db=await claude.use("db")}catch(e){}
  try{admin=user?await user.canEdit():false}catch(e){}
  if(admin)wire();
  if(!db){$("msg").textContent=admin?"Mode local (données non partagées).":"Connectez-vous pour suivre les matchs en direct.";render();return}
  const t=setTimeout(()=>{$("msg").textContent="Connexion lente… les données peuvent être obsolètes."},10000);
  db.doc("club/info").onSnapshot(s=>{if(s.exists)CLUB={...CLUB,...s.data()};render()},()=>{});
  db.collection("cat").orderBy("order").onSnapshot(s=>{
    clearTimeout(t);
    CATS=s.docs.map(d=>{const x=d.data();return{...x,players:x.players||[],m:{...newM(),...x.m}}});
    $("msg").textContent="";
    if(admin&&!CATS.length)tab="club";
    render();
  },e=>{clearTimeout(t);err("Données inaccessibles ("+(e.code||"erreur")+").")});
})();
</script></body></html>
